<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generate Request - TISS Auto-Anmelden</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        :root {
            --primary-blue: #3498db;
            --dark-blue: #2c3e50;
            --light-gray: #e1e8ed;
            --medium-gray: #95a5a6;
            --success-green: #27ae60;
            --error-red: #c0392b;
            --background-light: #f5f7fb;
            --text-dark: #333;
            --text-light: #fff;
            --card-background: #ffffff;
            --shadow-light: rgba(0,0,0,0.08);
            --border-radius-base: 12px;
            --spacing-md: 16px;
            --spacing-lg: 24px;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--background-light);
            padding: var(--spacing-lg);
            margin: 0;
            color: var(--text-dark);
        }

        .nav {
            margin: 0 auto var(--spacing-md);
            max-width: 900px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 0;
        }

        .nav a, .nav span {
            margin-right: var(--spacing-md);
            text-decoration: none;
            font-weight: 500;
            color: var(--dark-blue);
            transition: color 0.2s ease;
        }

        .nav a:hover {
            color: var(--primary-blue);
        }

        .card {
            max-width: 900px;
            margin: 0 auto;
            background: var(--card-background);
            border-radius: var(--border-radius-base);
            box-shadow: 0 10px 30px var(--shadow-light);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, var(--dark-blue) 0%, var(--primary-blue) 100%);
            color: var(--text-light);
            padding: var(--spacing-lg);
        }

        .header h2 {
            margin-top: 0;
            margin-bottom: 8px;
            font-weight: 700;
        }

        .header p {
            margin-bottom: 0;
            font-weight: 300;
        }

        .content {
            padding: var(--spacing-lg);
        }

        label {
            display: block;
            margin: var(--spacing-md) 0 6px;
            font-weight: 600;
            color: var(--dark-blue);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--light-gray);
            border-radius: 8px;
            font-size: 15px;
            transition: all 0.2s ease;
            box-sizing: border-box; /* Ensures padding doesn't increase width */
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 3px rgba(52,152,219,0.1);
        }

        .row {
            display: flex;
            gap: var(--spacing-md);
            flex-wrap: wrap;
        }

        .row .col {
            flex: 1 1 calc(50% - var(--spacing-md) / 2); /* Two columns on larger screens */
        }

        @media (max-width: 768px) {
            .row .col {
                flex: 1 1 100%; /* Stack columns on smaller screens */
            }
        }

        .btn {
            padding: 12px 18px;
            border: none;
            border-radius: 8px;
            background: var(--primary-blue);
            color: var(--text-light);
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn i {
            font-size: 1.1em;
        }

        .btn:hover {
            background-color: #2a7fb3;
            transform: translateY(-1px);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn.secondary {
            background: var(--medium-gray);
        }
        .btn.secondary:hover {
            background-color: #7b8d8e;
        }

        .status {
            margin-top: var(--spacing-md);
            padding: 10px 15px;
            border-radius: 8px;
            font-weight: 500;
            border: 1px solid transparent;
        }

        .status.success {
            color: var(--success-green);
            background-color: rgba(39, 174, 96, 0.1);
            border-color: var(--success-green);
        }

        .status.error {
            color: var(--error-red);
            background-color: rgba(192, 57, 43, 0.1);
            border-color: var(--error-red);
        }

        .mode {
            display: flex;
            gap: 8px;
            margin: 6px 0 var(--spacing-md);
            flex-wrap: wrap;
        }

        .mode .opt {
            flex: 1;
            text-align: center;
            border: 2px solid var(--light-gray);
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            min-width: 90px; /* Ensure options don't get too small */
        }

        .mode .opt:hover {
            border-color: var(--primary-blue);
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .mode .opt.active {
            background: var(--primary-blue);
            color: var(--text-light);
            border-color: var(--primary-blue);
            font-weight: 500;
        }

        .hint {
            color: #6c757d;
            font-size: 13px;
            margin-top: 4px;
            margin-bottom: var(--spacing-md);
            line-height: 1.4;
        }

        .button-group {
            margin-top: var(--spacing-md);
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
    </style>
</head>
<body>
    <div class="nav">
        <div>
            <a href="/generate"><i class="fas fa-magic"></i> Generate</a>
            <a href="/requests"><i class="fas fa-list-alt"></i> Requests</a>
        </div>
        <div>
            <span id="welcomeUser"></span>
            <button id="logoutBtn" class="btn secondary"><i class="fas fa-sign-out-alt"></i> Logout</button>
        </div>
    </div>
    <div class="card">
        <div class="header">
            <h2><i class="fas fa-cogs"></i> Create/Update Configuration</h2>
            <p><i class="fas fa-pen-to-square"></i> Fill out details and save. <i class="fas fa-arrow-right"></i> Send from the Requests page.</p>
        </div>
        <div class="content">
            <div class="row">
                <div class="col">
                    <label for="username"><i class="fas fa-user"></i> Username *</label>
                    <input id="username" type="text" placeholder="Your TISS username" />
                </div>
                <div class="col">
                    <label for="password"><i class="fas fa-key"></i> Password *</label>
                    <input id="password" type="password" placeholder="Your TISS password" />
                </div>
            </div>
            <div class="row">
                <div class="col">
                    <label for="dswid"><i class="fas fa-id-badge"></i> DSWID *</label>
                    <input id="dswid" type="text" placeholder="DSWID from TISS URL" />
                </div>
                <div class="col">
                    <label for="dsrid"><i class="fas fa-id-card"></i> DSRID *</label>
                    <input id="dsrid" type="text" placeholder="DSRID from TISS URL" />
                </div>
            </div>
            <div class="row">
                <div class="col">
                    <label for="semester"><i class="fas fa-calendar-alt"></i> Semester *</label>
                    <input id="semester" type="text" placeholder="e.g., 2025S or 2025W" />
                </div>
                <div class="col">
                    <label for="courseNr"><i class="fas fa-book"></i> Course Number *</label>
                    <input id="courseNr" type="text" placeholder="e.g., 101.234" />
                </div>
            </div>
            <label><i class="fas fa-compass"></i> Registration Mode *</label>
            <div class="mode">
                <div class="opt active" data-mode="exam"><i class="fas fa-clipboard-list"></i> Exam</div>
                <div class="opt" data-mode="group"><i class="fas fa-users"></i> Group</div>
                <div class="opt" data-mode="course"><i class="fas fa-graduation-cap"></i> Course</div>
            </div>
            <input id="mode" type="hidden" value="exam" />
            <div class="row">
                <div class="col">
                    <label for="group_index"><i class="fas fa-sort-numeric-up-alt"></i> Group Index *</label>
                    <input id="group_index" type="number" value="1" />
                </div>
                <div class="col">
                    <label for="slot_index"><i class="fas fa-bullseye"></i> Slot Index</label>
                    <input id="slot_index" type="number" placeholder="Optional" />
                </div>
            </div>
            <label for="study_number"><i class="fas fa-user-graduate"></i> Study Number</label>
            <input id="study_number" type="text" placeholder="e.g., 123 456" />
            <div class="hint">Include a space between first 3 and last 3 digits</div>
            <label for="anmelden_time"><i class="fas fa-clock"></i> Schedule Registration Time</label>
            <input id="anmelden_time" type="datetime-local" />
            <div class="button-group">
                <button id="validateBtn" class="btn secondary"><i class="fas fa-search"></i> Validate</button>
                <button id="saveBtn" class="btn"><i class="fas fa-save"></i> Save</button>
                <button id="sendAndGoBtn" class="btn secondary"><i class="fas fa-paper-plane"></i> Send Request</button>
                <button id="clearBtn" class="btn secondary"><i class="fas fa-trash-alt"></i> Clear</button>
            </div>
            <div id="status" class="status"></div>
        </div>
    </div>
    <script>
        const $ = (id)=>document.getElementById(id);
        function showStatus(msg, ok){ const el=$('status'); el.textContent=msg; el.className='status ' + (ok?'success':'error'); }
        
        // Function to set default time (1 hour in the future)
        function setDefaultTime() {
            const dt = $('anmelden_time');
            const now = new Date();
            now.setHours(now.getHours() + 1); // Set to 1 hour in the future
            dt.value = now.toISOString().slice(0, 16);
        }
        
        function collect(){
            const map = ['username','password','dswid','dsrid','semester','courseNr','mode','group_index','slot_index','study_number','anmelden_time'];
            const d = {};
            map.forEach(k=>{
                const el=$(k);
                if(!el) return;
                let v=el.value.trim(); // Trim whitespace
                if(el.type==='number'&&v!=='') {
                    v=parseInt(v);
                    // Enforce 1-based indices in UI; 0 is not accepted
                    if ((k === 'group_index' || k === 'slot_index') && v <= 0) {
                        throw new Error('Group and Slot Index must start at 1');
                    }
                    // Convert to 0-based for backend when provided
                    if ((k === 'group_index' || k === 'slot_index') && v >= 1) {
                        v = v - 1;
                    }
                }
                if(el.type==='datetime-local'&&v) v=v.replace('T',' ') + ':00';
                if(v!==''&&v!=null) d[k]=v;
            });
            return d;
        }

        function clearFields() {
            const map = ['username','password','dswid','dsrid','semester','courseNr','group_index','slot_index','study_number','anmelden_time'];
            map.forEach(k => {
                const el = $(k);
                if (el) {
                    el.value = '';
                }
            });
            // Reset mode to default (exam)
            document.querySelectorAll('.opt').forEach(x => x.classList.remove('active'));
            document.querySelector('.opt[data-mode="exam"]')?.classList.add('active');
            $('mode').value = 'exam';
            showStatus('All fields cleared!', true);
            // Set default time (1 hour in the future)
            setDefaultTime();
        }

        async function loadConfig(){
            let c = {};
            let hasConfig = false;
            
            // Prefer server-stored config
            try{ 
                const resp = await fetch('/api/user_config'); 
                const res = await resp.json(); 
                if(res && res.success && res.config){ 
                    c = res.config; 
                    hasConfig = true;
                } 
            }catch(e){}
            
            // Fallback to injected/window
            if(!hasConfig){ 
                if(window.EXISTING_CONFIG){ 
                    c = window.EXISTING_CONFIG; 
                    hasConfig = true;
                } 
            }
            
            // Fallback to localStorage
            if(!hasConfig){ 
                try{ 
                    const stored = localStorage.getItem('tiss_config'); 
                    if(stored){ 
                        c = JSON.parse(stored); 
                        hasConfig = true;
                    } 
                }catch(e){} 
            }
            
            if(hasConfig && c && Object.keys(c).length){
                Object.keys(c).forEach(k=>{
                    const el=$(k);
                    if(!el||c[k]==null) return;
                    
                    // Skip loading anmelden_time - always use default (1 hour in future)
                    if(k === 'anmelden_time') return;
                    
                    if(el.type==='datetime-local' && typeof c[k]==='string' && c[k].includes(' ')){
                        el.value = c[k].replace(' ','T').substring(0,16);
                    } else {
                        el.value=c[k];
                    }
                });
                
                if(c.mode){ 
                    document.querySelectorAll('.opt').forEach(x=>x.classList.remove('active')); 
                    document.querySelector(`.opt[data-mode="${c.mode}"]`)?.classList.add('active'); 
                    $('mode').value=c.mode; 
                }
                showStatus('📋 Loaded saved configuration. Registration time set to 1 hour from now for safety.', true);
            }
            
            // Always set default time (1 hour in future) regardless of whether config was loaded
            setDefaultTime();
        }
        
        function wireMode(){ 
            document.querySelectorAll('.opt').forEach(opt=>{ 
                opt.addEventListener('click',()=>{ 
                    document.querySelectorAll('.opt').forEach(x=>x.classList.remove('active')); 
                    opt.classList.add('active'); 
                    $('mode').value = opt.dataset.mode; 
                }); 
            }); 
        }
        
        $('validateBtn').addEventListener('click', async ()=>{
            try{ 
                const res = await fetch('/api/validate',{ 
                    method:'POST', 
                    headers:{'Content-Type':'application/json'}, 
                    body: JSON.stringify(collect())
                }); 
                const data=await res.json(); 
                if(data.valid){ 
                    showStatus('Configuration is valid', true);
                } else { 
                    const msg = data.errors ? Object.entries(data.errors).map(([k,v])=>`${k}: ${v}`).join(', ') : (data.error||'Invalid'); 
                    showStatus(msg,false);
                } 
            } catch(e){ 
                showStatus(e.message,false); 
            }
        });
        
        $('saveBtn').addEventListener('click', async ()=>{
            const cfg = collect();
            try{
                // Save to backend
                const resp = await fetch('/api/user_config', { 
                    method:'POST', 
                    headers:{'Content-Type':'application/json'}, 
                    body: JSON.stringify(cfg)
                });
                const res = await resp.json();
                if(!res.success){ 
                    throw new Error(res.message || 'Save failed'); 
                }
                // Keep local copy
                localStorage.setItem('tiss_config', JSON.stringify(cfg));
                showStatus('✅ Configuration saved!', true);
            } catch(e){ 
                showStatus(e.message,false); 
            }
        });
        
        $('sendAndGoBtn').addEventListener('click', async ()=>{
            try{
                const cfg = collect();
                showStatus('Sending request...', true);
                const r = await fetch('/api/requests',{ 
                    method:'POST', 
                    headers:{'Content-Type':'application/json'}, 
                    body: JSON.stringify(cfg)
                });
                const d = await r.json();
                if(d.success){
                    showStatus('Request queued. Redirecting to Requests...', true);
                    window.location.href = '/requests';
                } else {
                    showStatus(d.message||'Failed to send request', false);
                }
            }catch(e){ 
                showStatus(e.message, false); 
            }
        });

        $('clearBtn').addEventListener('click', clearFields);
        
        async function logout(){ 
            try{ 
                await fetch('/auth/logout',{method:'POST'}); 
                window.location.href='/login'; 
            }catch(e){} 
        }
        $('logoutBtn').addEventListener('click', logout);
        
        window.addEventListener('load', async ()=>{
            $('welcomeUser').textContent = (window.SESSION_USER) ? `Logged in as ${window.SESSION_USER}` : '';
            
            // Load configuration first (this will also set the default time)
            await loadConfig(); 
            wireMode();
        });
    </script>
</body>
</html>
