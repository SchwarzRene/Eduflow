<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generate Request - TISS Auto-Anmelden</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="/static/css/generate.css">
</head>
<body>
    <div class="nav">
        <div>
            <a href="/generate"><i class="fas fa-magic"></i> Generate</a>
            <a href="/requests"><i class="fas fa-list-alt"></i> Requests</a>
        </div>
        <div>
            <span id="welcomeUser"></span>
            <button id="logoutBtn" class="btn secondary"><i class="fas fa-sign-out-alt"></i> Logout</button>
        </div>
    </div>
    <div class="card">
        <div class="header">
            <h2><i class="fas fa-cogs"></i> Create/Update Configuration</h2>
            <p><i class="fas fa-pen-to-square"></i> Fill out details and save. <i class="fas fa-arrow-right"></i> Send from the Requests page.</p>
        </div>
        <div class="content">
            <div class="row">
                <div class="col">
                    <label for="username"><i class="fas fa-user"></i> Username *</label>
                    <input id="username" type="text" placeholder="Your TISS username" />
                </div>
                <div class="col">
                    <label for="password"><i class="fas fa-key"></i> Password *</label>
                    <input id="password" type="password" placeholder="Your TISS password" />
                </div>
            </div>
            <div class="row">
                <div class="col">
                    <label for="dswid"><i class="fas fa-id-badge"></i> DSWID *</label>
                    <input id="dswid" type="text" placeholder="DSWID from TISS URL" />
                </div>
                <div class="col">
                    <label for="dsrid"><i class="fas fa-id-card"></i> DSRID *</label>
                    <input id="dsrid" type="text" placeholder="DSRID from TISS URL" />
                </div>
            </div>
            <div class="row">
                <div class="col">
                    <label for="semester"><i class="fas fa-calendar-alt"></i> Semester *</label>
                    <input id="semester" type="text" placeholder="e.g., 2025S or 2025W" />
                </div>
                <div class="col">
                    <label for="courseNr"><i class="fas fa-book"></i> Course Number *</label>
                    <input id="courseNr" type="text" placeholder="e.g., 101.234" />
                </div>
            </div>
            <label><i class="fas fa-compass"></i> Registration Mode *</label>
            <div class="mode">
                <div class="opt active" data-mode="exam"><i class="fas fa-clipboard-list"></i> Exam</div>
                <div class="opt" data-mode="group"><i class="fas fa-users"></i> Group</div>
                <div class="opt" data-mode="course"><i class="fas fa-graduation-cap"></i> Course</div>
            </div>
            <input id="mode" type="hidden" value="exam" />
            <div class="row">
                <div class="col">
                    <label for="group_index"><i class="fas fa-sort-numeric-up-alt"></i> Group Index *</label>
                    <input id="group_index" type="number" value="1" />
                </div>
                <div class="col">
                    <label for="slot_index"><i class="fas fa-bullseye"></i> Slot Index</label>
                    <input id="slot_index" type="number" placeholder="Optional" />
                </div>
            </div>
            <label for="study_number"><i class="fas fa-user-graduate"></i> Study Number</label>
            <input id="study_number" type="text" placeholder="e.g., 123 456" />
            <div class="hint">Include a space between first 3 and last 3 digits</div>
            <label for="anmelden_time"><i class="fas fa-clock"></i> Schedule Registration Time</label>
            <input id="anmelden_time" type="datetime-local" />
            <div class="button-group">
                <button id="validateBtn" class="btn secondary"><i class="fas fa-search"></i> Validate</button>
                <button id="saveBtn" class="btn"><i class="fas fa-save"></i> Save</button>
                <button id="sendAndGoBtn" class="btn secondary"><i class="fas fa-paper-plane"></i> Send Request</button>
                <button id="clearBtn" class="btn secondary"><i class="fas fa-trash-alt"></i> Clear</button>
            </div>
            <div id="status" class="status"></div>
        </div>
    </div>
    <script src="/static/js/generate.js"></script>
    
    <!-- Footer -->
    <div style="text-align: center; margin-top: 0px; padding: 0px; color: #666; font-size: 14px; border-top: 1px solid #eee;">
        A Retsche Creation 🚀
    </div>
</body>
</html>
