<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - TISS Auto-Anmelden</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="/static/css/login.css">
</head>
<body>
    <div class="card">
        <div class="header">
            <h2><i class="fas fa-hand-sparkles"></i> Welcome</h2>
            <p><i class="fas fa-lock"></i> Login or <i class="fas fa-user-plus"></i> create an account to continue.</p>
        </div>
        <div class="content">
            <div class="tabs">
                <div class="tab active" data-mode="login"><i class="fas fa-sign-in-alt"></i> Login</div>
                <div class="tab" data-mode="register"><i class="fas fa-user-plus"></i> Register</div>
            </div>
            <div>
                <label for="username"><i class="fas fa-user"></i> Username</label>
                <input id="username" placeholder="e12345678" />
                <label for="password"><i class="fas fa-key"></i> Password</label>
                <input id="password" type="password" />
                <button id="submitBtn"><i class="fas fa-arrow-right"></i> Continue</button>
                <div id="status" class="status"></div>
            </div>
        </div>
    </div>
    <script src="/static/js/login.js"></script>
    
    <!-- Footer -->
    <div style="text-align: center; margin-top: 40px; padding: 20px; color: #666; font-size: 16px; border-top: 2px solid #ddd; background: #f8f9fa; font-weight: 600;">
        A Retsche Creation 🚀
    </div>
</body>
</html>
