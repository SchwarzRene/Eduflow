<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - TISS Auto-Anmelden</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        :root {
            --primary-blue: #3498db;
            --dark-blue: #2c3e50;
            --light-gray: #e1e8ed;
            --medium-gray: #95a5a6;
            --success-green: #27ae60;
            --error-red: #c0392b;
            --background-light: #f5f7fb;
            --text-dark: #333;
            --text-light: #fff;
            --card-background: #ffffff;
            --shadow-light: rgba(0,0,0,0.08);
            --border-radius-base: 12px;
            --spacing-md: 16px;
            --spacing-lg: 24px;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--background-light);
            padding: var(--spacing-lg);
            margin: 0;
            color: var(--text-dark);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh; /* Center vertically on page */
        }

        .card {
            max-width: 420px;
            margin: 0 auto;
            background: var(--card-background);
            border-radius: var(--border-radius-base);
            box-shadow: 0 10px 30px var(--shadow-light);
            overflow: hidden; /* Ensure header gradient doesn't bleed */
        }

        .header {
            background: linear-gradient(135deg, var(--dark-blue) 0%, var(--primary-blue) 100%);
            color: var(--text-light);
            padding: var(--spacing-lg);
            text-align: center;
        }

        .header h2 {
            margin-top: 0;
            margin-bottom: 8px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .header p {
            margin-bottom: 0;
            font-weight: 300;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .content {
            padding: var(--spacing-lg);
        }

        .tabs {
            display: flex;
            gap: 8px;
            margin: 10px 0 var(--spacing-md);
        }

        .tab {
            flex: 1;
            text-align: center;
            padding: 10px;
            border-radius: 8px;
            border: 2px solid var(--light-gray);
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 500;
            color: var(--dark-blue);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .tab:hover {
            border-color: var(--primary-blue);
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .tab.active {
            background: var(--primary-blue);
            color: var(--text-light);
            border-color: var(--primary-blue);
        }

        label {
            display: block;
            margin: var(--spacing-md) 0 6px;
            font-weight: 600;
            color: var(--dark-blue);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--light-gray);
            border-radius: 8px;
            font-size: 15px;
            transition: all 0.2s ease;
            box-sizing: border-box;
        }

        input:focus {
            outline: none;
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 3px rgba(52,152,219,0.1);
        }

        /* Improved button styles */
        #submitBtn { /* Targeting by ID for specific styling */
            width: 100%;
            padding: 12px 18px;
            margin-top: var(--spacing-md);
            border: none;
            border-radius: 8px;
            background: var(--primary-blue); /* Default button background to primary blue */
            color: var(--text-light);
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease, box-shadow 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 16px; /* Slightly larger text */
            box-shadow: 0 4px 15px rgba(52, 152, 219, 0.3); /* Add subtle shadow */
        }

        #submitBtn:hover {
            background-color: #2980b9; /* Darker blue on hover */
            transform: translateY(-2px); /* More pronounced lift */
            box-shadow: 0 6px 20px rgba(52, 152, 219, 0.4);
        }

        #submitBtn:active {
            transform: translateY(0);
            box-shadow: 0 2px 10px rgba(52, 152, 219, 0.2);
        }

        /* Specific styles for the Login/Register button based on active tab */
        /* This uses the general sibling selector to change the submit button's style */
        .tab.active[data-mode="login"] ~ div #submitBtn {
            background: var(--primary-blue);
            box-shadow: 0 4px 15px rgba(52, 152, 219, 0.3);
        }
        .tab.active[data-mode="login"] ~ div #submitBtn:hover {
            background-color: #2980b9;
        }

        .tab.active[data-mode="register"] ~ div #submitBtn {
            background: var(--success-green);
            box-shadow: 0 4px 15px rgba(39, 174, 96, 0.3);
        }
        .tab.active[data-mode="register"] ~ div #submitBtn:hover {
            background-color: #229954;
        }


        .status {
            margin-top: var(--spacing-md);
            padding: 10px 15px;
            border-radius: 8px;
            font-weight: 500;
            border: 1px solid transparent;
            text-align: center;
        }

        .status.success {
            color: var(--success-green);
            background-color: rgba(39, 174, 96, 0.1);
            border-color: var(--success-green);
        }

        .status.error {
            color: var(--error-red);
            background-color: rgba(192, 57, 43, 0.1);
            border-color: var(--error-red);
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <h2><i class="fas fa-hand-sparkles"></i> Welcome</h2>
            <p><i class="fas fa-lock"></i> Login or <i class="fas fa-user-plus"></i> create an account to continue.</p>
        </div>
        <div class="content">
            <div class="tabs">
                <div class="tab active" data-mode="login"><i class="fas fa-sign-in-alt"></i> Login</div>
                <div class="tab" data-mode="register"><i class="fas fa-user-plus"></i> Register</div>
            </div>
            <div>
                <label for="username"><i class="fas fa-user"></i> Username</label>
                <input id="username" placeholder="e12345678" />
                <label for="password"><i class="fas fa-key"></i> Password</label>
                <input id="password" type="password" />
                <button id="submitBtn"><i class="fas fa-arrow-right"></i> Continue</button>
                <div id="status" class="status"></div>
            </div>
        </div>
    </div>
<script>
let mode = 'login';
const tabs = document.querySelectorAll('.tab');
tabs.forEach(t => t.addEventListener('click', () => {
    tabs.forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    mode = t.dataset.mode;
    document.getElementById('status').textContent = '';
    document.getElementById('status').className = 'status'; // Clear previous status styling
}));

function setStatus(text, ok=false) {
    const el = document.getElementById('status');
    el.textContent = text;
    el.className = 'status ' + (ok ? 'success' : 'error');
}

document.getElementById('submitBtn').addEventListener('click', async () => {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    if (!username || !password) { setStatus('Please fill username and password', false); return; }
    try {
        const res = await fetch(mode === 'login' ? '/auth/login' : '/auth/register', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (data.success) {
            setStatus(data.message || 'Success!', true);
            window.location.href = '/';
            return;
        }
        setStatus(data.message || 'Failed', false);
    } catch (e) {
        setStatus(e.message, false);
    }
});
</script>
</body>
</html>
