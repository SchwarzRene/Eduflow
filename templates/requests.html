<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Requests - TISS Auto-Anmelden</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="/static/css/requests.css">
</head>
<body>
    <div class="nav">
        <div>
            <a href="/generate"><i class="fas fa-magic"></i> Generate</a>
            <a href="/requests"><i class="fas fa-list-alt"></i> Requests</a>
        </div>
        <div>
            <span id="welcomeUser"></span>
            <button id="logoutBtn" class="btn secondary"><i class="fas fa-sign-out-alt"></i> Logout</button>
        </div>
    </div>
    <div class="card">
        <div class="header">
            <h2><i class="fas fa-list-alt"></i> Requests</h2>
            <p><i class="fas fa-eye"></i> Monitor and <i class="fas fa-times"></i> cancel your queued or running requests.</p>
        </div>
        <div class="content">
            <div class="row">
                <a class="btn" href="/generate"><i class="fas fa-plus"></i> New Request</a>
                <button id="refreshBtn" class="btn secondary"><i class="fas fa-sync-alt"></i> Refresh</button>
            </div>
            <div id="status" class="status"></div>
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Status <i class="fas fa-chart-bar"></i></th>
                        <th>Executed <i class="fas fa-check-circle"></i></th>
                        <th>Message <i class="fas fa-comment-dots"></i></th>
                        <th>Updated <i class="fas fa-clock"></i></th>
                        <th>Action <i class="fas fa-bolt"></i></th>
                    </tr>
                </thead>
                <tbody id="tbody"></tbody>
            </table>
        </div>
    </div>
    <script src="/static/js/requests.js"></script>
    
    <!-- Footer -->
    <div style="text-align: center; margin-top: 40px; padding: 20px; color: #666; font-size: 16px; border-top: 2px solid #ddd; background: #f8f9fa; font-weight: 600;">
        A Retsche Creation 🚀
    </div>
</body>
</html>
