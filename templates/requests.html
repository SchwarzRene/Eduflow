<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Requests - TISS Auto-Anmelden</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        :root {
            --primary-blue: #3498db;
            --dark-blue: #2c3e50;
            --light-gray: #e1e8ed;
            --medium-gray: #95a5a6;
            --success-green: #27ae60;
            --error-red: #c0392b;
            --background-light: #f5f7fb;
            --text-dark: #333;
            --text-light: #fff;
            --card-background: #ffffff;
            --shadow-light: rgba(0,0,0,0.08);
            --border-radius-base: 12px;
            --spacing-md: 16px;
            --spacing-lg: 24px;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--background-light);
            padding: var(--spacing-lg);
            margin: 0;
            color: var(--text-dark);
        }

        .nav {
            margin: 0 auto var(--spacing-md);
            max-width: 900px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 0;
        }

        .nav a, .nav span {
            margin-right: var(--spacing-md);
            text-decoration: none;
            font-weight: 500;
            color: var(--dark-blue);
            transition: color 0.2s ease;
        }

        .nav a:hover {
            color: var(--primary-blue);
        }

        .card {
            max-width: 900px;
            margin: 0 auto;
            background: var(--card-background);
            border-radius: var(--border-radius-base);
            box-shadow: 0 10px 30px var(--shadow-light);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, var(--dark-blue) 0%, var(--primary-blue) 100%);
            color: var(--text-light);
            padding: var(--spacing-lg);
        }

        .header h2 {
            margin-top: 0;
            margin-bottom: 8px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header p {
            margin-bottom: 0;
            font-weight: 300;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .content {
            padding: var(--spacing-lg);
        }

        .row {
            display: flex;
            gap: var(--spacing-md);
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: var(--spacing-md); /* Add margin for spacing below rows */
        }

        .btn {
            padding: 12px 18px;
            border: none;
            border-radius: 8px;
            background: var(--primary-blue);
            color: var(--text-light);
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn i {
            font-size: 1.1em;
        }

        .btn:hover {
            background-color: #2a7fb3;
            transform: translateY(-1px);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn.secondary {
            background: var(--medium-gray);
        }
        .btn.secondary:hover {
            background-color: #7b8d8e;
        }
        .btn.sm { /* Smaller button for table actions */
            padding: 6px 10px;
            font-size: 0.85em;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: var(--spacing-md);
            background: var(--card-background);
            border-radius: var(--border-radius-base);
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05); /* Lighter shadow for table */
        }

        th, td {
            text-align: left;
            padding: 12px;
            border-bottom: 1px solid var(--light-gray);
            font-size: 15px;
        }

        th {
            background: #f0f4f8;
            font-weight: 600;
            color: var(--dark-blue);
        }

        .status {
            margin-top: var(--spacing-md);
            padding: 10px 15px;
            border-radius: 8px;
            font-weight: 500;
            border: 1px solid transparent;
        }

        .status.success {
            color: var(--success-green);
            background-color: rgba(39, 174, 96, 0.1);
            border-color: var(--success-green);
        }

        .status.error {
            color: var(--error-red);
            background-color: rgba(192, 57, 43, 0.1);
            border-color: var(--error-red);
        }
    </style>
</head>
<body>
    <div class="nav">
        <div>
            <a href="/generate"><i class="fas fa-magic"></i> Generate</a>
            <a href="/requests"><i class="fas fa-list-alt"></i> Requests</a>
        </div>
        <div>
            <span id="welcomeUser"></span>
            <button id="logoutBtn" class="btn secondary"><i class="fas fa-sign-out-alt"></i> Logout</button>
        </div>
    </div>
    <div class="card">
        <div class="header">
            <h2><i class="fas fa-list-alt"></i> Requests</h2>
            <p><i class="fas fa-eye"></i> Monitor and <i class="fas fa-times"></i> cancel your queued or running requests.</p>
        </div>
        <div class="content">
            <div class="row">
                <a class="btn" href="/generate"><i class="fas fa-plus"></i> New Request</a>
                <button id="refreshBtn" class="btn secondary"><i class="fas fa-sync-alt"></i> Refresh</button>
            </div>
            <div id="status" class="status"></div>
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Status <i class="fas fa-chart-bar"></i></th>
                        <th>Executed <i class="fas fa-check-circle"></i></th>
                        <th>Message <i class="fas fa-comment-dots"></i></th>
                        <th>Updated <i class="fas fa-clock"></i></th>
                        <th>Action <i class="fas fa-bolt"></i></th>
                    </tr>
                </thead>
                <tbody id="tbody"></tbody>
            </table>
        </div>
    </div>
<script>
const $ = (id)=>document.getElementById(id);
function showStatus(msg, ok){ const el=$('status'); el.textContent=msg; el.className='status ' + (ok?'success':'error'); }
async function logout(){ try{ await fetch('/auth/logout',{method:'POST'}); window.location.href='/login'; }catch(e){} }
$('logoutBtn').addEventListener('click', logout);

async function fetchConfig(){ try{ const s = localStorage.getItem('tiss_config'); return s ? JSON.parse(s) : {}; } catch(e){ return {}; } }
async function listRequests(){ try{ const r = await fetch('/api/requests'); const d = await r.json(); if(!d.success) return []; return d.requests; } catch(e){ return []; } }
function canCancel(status){ return status==='queued' || status==='running' || status==='cancelling'; }
function renderRows(rows){ const tb=$('tbody'); tb.innerHTML = rows.map(r=>{
    const escMsg = (r.message||'').replace(/</g,'&lt;');
    const cancelBtn = canCancel(r.status) ? `<button data-cancel="${r.id}" class="btn secondary sm"><i class="fas fa-times"></i> Cancel</button>` : '';
    const successIcon = r.success ? '✅' : (r.success === false ? '❌' : '⏳'); // Added a loading icon for null/pending
    return `<tr><td>${r.id}</td><td>${r.status}</td><td>${successIcon}</td><td>${escMsg}</td><td>${r.updated_at||''}</td><td>${cancelBtn}</td></tr>`;
}).join('');
Array.from(tb.querySelectorAll('button[data-cancel]')).forEach(btn=>{ btn.addEventListener('click', ()=> cancelRequest(parseInt(btn.dataset.cancel))); }); }

async function send(){
    try{
        showStatus('Starting request...', true);
        const cfg = await fetchConfig();
        const r = await fetch('/api/requests',{ method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(cfg)});
        const d = await r.json();
        if(d.success){ showStatus('Request started. Monitoring...', true); monitor(d.request_id); refresh(); }
        else { showStatus(d.message||'Failed to start', false); }
    }catch(e){ showStatus(e.message, false); }
}

// monitoring removed to reduce server load

async function refresh(){ const rows = await listRequests(); renderRows(rows); }
$('refreshBtn').addEventListener('click', refresh);

window.addEventListener('load', async ()=>{
    $('welcomeUser').textContent = (window.SESSION_USER) ? `👤 Logged in as ${window.SESSION_USER}` : '';
    await refresh();
});

async function cancelRequest(id){
    try{
        const r = await fetch(`/api/requests/${id}/cancel`, {method:'POST'});
        const d = await r.json();
        if(d.success){ showStatus('Cancellation requested', true); refresh(); }
        else { showStatus(d.message||'Failed to cancel', false); }
    }catch(e){ showStatus(e.message, false); }
}
</script>
</body>
</html>
